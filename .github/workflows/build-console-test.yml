name: Compile Console Test Branch

on:
  push:
    branches:
      - console # Only run on the 'console' branch

jobs:
  build:
    runs-on: windows-latest

    # No need for the 'contents: write' permission since we are not creating a release
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile with csc.exe
        run: |
          # Create the output directory
          mkdir out
          
          # Compile the single C# file into a Console application
          csc /target:exe /out:./out/RDPShell.exe RDPShell.cs `
            /r:System.Runtime.InteropServices.dll `
            /r:Microsoft.Win32.SystemEvents.dll
          
          Write-Output "Compilation successful. Executable created: ./out/RDPShell.exe"

      # 1. NEW: Upload the compiled executable as an Artifact
      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          # This name appears on the GitHub Actions summary page
          name: RDPShell-Console-Build
          # Path to the compiled executable
          path: out/RDPShell.exe
          # Keep artifact for 7 days
          retention-days: 7
