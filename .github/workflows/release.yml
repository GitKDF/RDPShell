name: Compile Console Test Branch

on:
  push:
    branches:
      - console # Only runs on pushes to the 'console' branch

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # Read-only permission is sufficient

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # This copies RDPShell.cs onto the runner.

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create .NET Console Project
        run: |
          # Creates RDPShell.csproj in the current directory
          dotnet new console --name RDPShell --output . --force
          
          # Remove the default Program.cs file (since RDPShell.cs contains the Main method)
          Remove-Item Program.cs

      - name: Add Required Dependencies
        run: |
          # Adds the package needed for SystemEvents.SessionSwitch
          dotnet add RDPShell.csproj package Microsoft.Win32.SystemEvents

      - name: Compile and Publish Executable
        run: |
          # Creates a standalone executable for Windows 64-bit in the ./out directory
          dotnet publish RDPShell.csproj -c Release -r win-x64 --self-contained true -o ./out

      - name: Upload compiled executable as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDPShell-Console-Build
          path: ./out/RDPShell.exe # The path to the self-contained executable
          retention-days: 7
