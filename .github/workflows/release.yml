name: Build and Release RDPShell

on:
  push:
    tags:
      - 'v*'    # Only run when a version tag is pushed

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write    # allow creating releases & uploading assets
      # everything else (issues, pull requests, etc.) defaults to 'none'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4 for consistency/latest

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4 # Updated to v4
        with:
          dotnet-version: '8.0.x'    # Target .NET 8 LTS

      # --- START: New Compilation Logic from the other workflow ---

      - name: Create .NET Console Project (Targeting Windows GUI Subsystem)
        run: |
          # 1. Use --framework net8.0 to suppress CA1416 warnings
          # 2. Creates RDPShell.csproj in the current directory
          dotnet new console --name RDPShell --output . --force --framework net8.0
          
          # 3. Remove the default Program.cs file (since RDPShell.cs contains the Main method)
          Remove-Item Program.cs

          # 4. CRITICAL: Replace the TargetFramework and inject the WindowsSubsystem property.
          (Get-Content RDPShell.csproj) -replace '<TargetFramework>.*</TargetFramework>','<TargetFramework>net8.0-windows</TargetFramework><WindowsSubsystem>Windows</WindowsSubsystem>' |
          Set-Content RDPShell.csproj

          # 5. CRITICAL STEP: Change the OutputType from 'Exe' (Console) to 'WinExe' (GUI)
          (Get-Content RDPShell.csproj) -replace '<OutputType>Exe</OutputType>','<OutputType>WinExe</OutputType>' |
          Set-Content RDPShell.csproj
          
      - name: Add Required Dependencies
        run: |
          # Adds the package needed for SystemEvents/Registry access
          dotnet add RDPShell.csproj package Microsoft.Win32.SystemEvents

      - name: Compile and Publish Single-File Executable
        run: |
          # /p:PublishSingleFile=true: Creates a single executable file.
          # /p:PublishTrimmed=true: Reduces the size of the executable.
          # -r win-x64: Targets Windows 64-bit for the self-contained app.
          dotnet publish RDPShell.csproj -c Release -r win-x64 --self-contained true `
            /p:PublishSingleFile=true /p:PublishTrimmed=true -o ./out `
            /p:InformationalVersion=${{ github.ref_name }} # Pass the tag version as InformationalVersion

      # --- END: New Compilation Logic ---

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: out/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
