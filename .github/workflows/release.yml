name: Build and Release RDPShell

on:
  push:
    tags:
      - 'v*'   # Only run when a version tag is pushed

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write   # allow creating releases & uploading assets
      # everything else (issues, pull requests, etc.) defaults to 'none'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'   # Target .NET 8 LTS

      - name: Create minimal project
        run: |
          dotnet new winforms -n RDPShell
          (Get-Content RDPShell\RDPShell.csproj) -replace 'net9.0-windows','net8.0-windows' |
            Set-Content RDPShell\RDPShell.csproj
          Remove-Item RDPShell\Program.cs   # delete the stub
          Move-Item RDPShell.cs RDPShell\RDPShell.cs

      - name: Build framework-dependent exe
        run: |
          cd RDPShell
          #dotnet publish -c Release -r win-x64 --self-contained false -o ../out `
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../out `
            /p:InformationalVersion=${{ github.ref_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: out/RDPShell.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
